[project]
name = "llm-observability"
version = "0.1.0"
description = "A FastAPI service for capturing and inspecting LLM calls, usage, and performance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
